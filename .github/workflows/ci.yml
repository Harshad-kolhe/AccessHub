name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AccessHub.sln

      - name: Build (warnings are errors)
        run: dotnet build AccessHub.sln --configuration Release --no-restore -warnaserror

      # Integration tests start SQL Server in Docker with Testcontainers (Docker is available on GitHub runners).
      - name: Test
        run: dotnet test AccessHub.sln --configuration Release --no-build --logger "trx" --results-directory TestResults

      - name: Check for vulnerable packages
        run: |
          dotnet list AccessHub.sln package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-results
          path: TestResults

  web:
    name: Web lint, types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end (Docker Compose + Playwright)
    runs-on: ubuntu-latest
    needs: [api, web]
    env:
      MSSQL_SA_PASSWORD: CI_only_Passw0rd!
      AUTH_RATE_LIMIT: 500
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        run: docker compose up --build --detach

      - name: Wait for the API and the web app
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5177/health/ready >/dev/null && curl -fsS http://localhost:3000/login >/dev/null; then exit 0; fi
            sleep 5
          done
          docker compose logs api web
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report

      - name: Stack logs
        if: failure()
        run: docker compose logs
